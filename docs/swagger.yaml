basePath: /
definitions:
  handlers.LoginRequest:
    properties:
      idToken:
        type: string
    required:
    - idToken
    type: object
  handlers.PaymentWebhookSample:
    properties:
      amount:
        example: 100.5
        type: number
      currency:
        example: USD
        type: string
      customer_id:
        example: cust_abc123
        type: string
      event_type:
        example: payment.completed
        type: string
      metadata:
        additionalProperties: true
        type: object
      payment_method:
        example: credit_card
        type: string
      status:
        example: completed
        type: string
      timestamp:
        example: "2024-01-15T10:30:00Z"
        type: string
      transaction_id:
        example: txn_123456789
        type: string
    type: object
  handlers.PromptReq:
    properties:
      full_name:
        example: John Doe
        maxLength: 100
        type: string
      professional_title:
        example: Full Stack Developer
        maxLength: 200
        type: string
      profile:
        example: Experienced developer with 5+ years in web development...
        maxLength: 1000
        type: string
    required:
    - full_name
    - professional_title
    - profile
    type: object
  types.APIResponse:
    properties:
      data: {}
      message:
        type: string
      status:
        type: string
      title:
        type: string
    type: object
  types.OptimizerResponse:
    properties:
      beforeAfterComparison:
        minLength: 1
        type: string
      fullAnalysis:
        minLength: 1
        type: string
      optimizedProfileOverview:
        minLength: 1
        type: string
      recommendedVisuals:
        minLength: 1
        type: string
      suggestedProjectTitles:
        minLength: 1
        type: string
      weaknessesAndOptimization:
        minLength: 1
        type: string
    required:
    - beforeAfterComparison
    - fullAnalysis
    - optimizedProfileOverview
    - recommendedVisuals
    - suggestedProjectTitles
    - weaknessesAndOptimization
    type: object
host: provolo-api.onrender.com
info:
  contact: {}
  description: This is the Provolo backend API server
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: Provolo API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates user with Firebase ID token and creates session cookie
      parameters:
      - description: Login request with ID token
        in: body
        name: loginRequest
        required: true
        schema:
          $ref: '#/definitions/handlers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/types.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/types.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/types.APIResponse'
      summary: User login
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      description: Logs out the user by clearing the session cookie
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.APIResponse'
      summary: User logout
      tags:
      - auth
  /api/v1/auth/verify:
    get:
      description: Verifies the current user session and returns user info
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/types.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/types.APIResponse'
      summary: Verify user session
      tags:
      - auth
  /api/v1/health:
    get:
      description: Returns a simple message to indicate the service is up
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.APIResponse'
      summary: Get health check
      tags:
      - health
  /api/v1/optimize-profile:
    post:
      consumes:
      - application/json
      description: Analyzes and optimizes a freelancer's profile content using AI
        to improve client attraction and profile effectiveness
      parameters:
      - description: Profile optimization request containing freelancer details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.PromptReq'
      produces:
      - application/json
      responses:
        "200":
          description: Profile optimization completed successfully
          schema:
            allOf:
            - $ref: '#/definitions/types.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/types.OptimizerResponse'
              type: object
        "400":
          description: Bad Request - Invalid input validation
          schema:
            $ref: '#/definitions/types.APIResponse'
        "401":
          description: Unauthorized - Unauthorized
          schema:
            $ref: '#/definitions/types.APIResponse'
        "429":
          description: Too Many Requests - Daily limit exceeded
          schema:
            $ref: '#/definitions/types.APIResponse'
        "500":
          description: Internal Server Error - AI service or client creation failed
          schema:
            $ref: '#/definitions/types.APIResponse'
      summary: Optimize freelancer profile using AI
      tags:
      - Profile Optimization
  /api/v1/payment-webhook:
    post:
      consumes:
      - application/json
      description: Handles payment webhook notifications from payment providers -
        accepts any JSON structure
      parameters:
      - description: Sample payment webhook structure (accepts any JSON)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.PaymentWebhookSample'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/types.APIResponse'
      summary: Handle payment webhook
      tags:
      - payments
schemes:
- https
- http
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
